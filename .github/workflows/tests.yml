name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # R36: the platform decides which variant a person gets. An SDK that derives its own
  # bucket can disagree with the server, and the same person is then served differently
  # depending on the channel they arrive through — silently, because each side is
  # internally consistent. Runs without install so it cannot be skipped.
  bucketing:
    name: Server-only bucketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No SDK derives buckets locally (R36)
        run: node scripts/check-no-local-bucketing.mjs
        env:
          GUARD_SRC: src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version composer.json's ">=8.1" promises, not a sample. 8.2 was
        # supported on paper and never executed once.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: xdebug
          # Keeps a stray call argument out of every stack trace. The SDK cannot
          # fix this from inside — see tests/CredentialGuardTest.php.
          ini-values: zend.exception_ignore_args=1
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse src --level=5 --no-progress
      - run: vendor/bin/phpunit --no-coverage

  mutation:
    # Pinned to one version on purpose: the mutants do not vary by runtime, so
    # running this across the matrix triples a multi-minute job for no signal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: xdebug
      - run: composer install --prefer-dist --no-progress
      - name: Mutation score
        run: vendor/bin/infection --min-msi=85 --threads=4 --no-progress --no-interaction
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: infection.log
          retention-days: 14
